name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # ruff нет в requirements.txt (он попадает в прод-образ) — ставим только в CI,
        # с фиксированной версией, чтобы набор правил не менялся между прогонами.
        run: pip install -r requirements.txt ruff==0.17.0

      - name: Lint
        run: make lint

      - name: Test
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          # config.py отклоняет пустые и placeholder-секреты ещё при импорте —
          # без этих значений pytest падает на сборе тестов. Значения тестовые.
          BOT_SECRET_KEY: ci-bot-secret-0123456789abcdef0123
          INVITE_TOKEN: ci-invite-token-0123456789abcdef
          ADMIN_API_KEY: ci-admin-api-key-0123456789abcdef
          MVP_APP_SECRET: ci-mvp-app-secret-0123456789abcdef
          MINIAPP_SESSION_SECRET: ci-miniapp-session-0123456789abcdef
        run: make test

  # TODO: deploy job — deployment mechanism for the standalone backend
  # (own docker-compose.yml, zero-copy Postgres volume reuse) is not
  # defined yet; wire this up once a target host/registry is chosen.
