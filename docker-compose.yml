# ===================================================================
# Production backend stack (standalone, no platform/ dependency).
#
# postgres here is the ONLY database access point: nothing else (bot,
# web, nginx) connects to it. Clients reach backend's HTTP API only.
#
# Data lives in the `backend_postgres_data` volume — a NEW volume, not
# platform's `platform_postgres_data`. Migrating existing data is a
# separate, manual step (dump from platform-postgres-1, restore here).
#
# The DB port is deliberately NOT published to the host.
# ===================================================================

services:
  postgres:
    image: postgres:16
    container_name: backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
      # Runs only on an empty volume (first init). schema_fixed.sql is idempotent
      # and already includes the payment migrations, so a fresh DB is ready to use.
      - ./db/schema_fixed.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ./static/downloads:/app/static/downloads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend_net
      - backend_api
      # Внешняя сеть платформы: bot, landing-pilot и platform-web ходят к API по имени `backend`.
      # Имя сервиса задаёт alias, поэтому BACKEND_URL=http://backend работает без изменений.
      - platform_default

volumes:
  backend_postgres_data:

networks:
  backend_net:
    driver: bridge
  # Network for API clients on the same host (platform-web nginx): they reach
  # backend:8000 here. postgres is NOT on it, so a client container cannot even
  # open a connection to the DB. Fixed name so other compose projects can join it
  # as an external network without knowing this project's directory name.
  backend_api:
    name: backend_api
    driver: bridge
  platform_default:
    external: true
