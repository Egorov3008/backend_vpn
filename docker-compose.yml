# ===================================================================
# Standalone backend deployment.
#
# backend has NO postgres service of its own — it connects over the
# network to the platform monorepo's `postgres` container (service name
# `postgres` in platform/docker-compose.yml, resolvable as `postgres` on
# platform_net) via DATABASE_URL in .env. Running a second postgres
# process against the same data volume caused WAL corruption on
# 2026-08-26 (both processes writing to platform_postgres_data
# concurrently) — do NOT reintroduce a local postgres service here.
#
# `caddy` publishes backend to the internet over HTTPS (automatic
# Let's Encrypt cert for BACKEND_DOMAIN, terminated here — not by
# platform/'s nginx). backend itself stays unpublished (`expose` only).
# Test/dev box only — see CLAUDE.md for why this isn't the prod story.
# ===================================================================

services:
  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - platform_net

  caddy:
    image: caddy:2-alpine
    container_name: backend-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - platform_net

networks:
  platform_net:
    external: true
    name: platform_default

volumes:
  caddy_data:
  caddy_config:
