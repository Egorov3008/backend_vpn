# ===================================================================
# Standalone backend deployment.
#
# backend has NO postgres service of its own — it connects over the
# network to the platform monorepo's `postgres` container (service name
# `postgres` in platform/docker-compose.yml, resolvable as `postgres` on
# platform_net) via DATABASE_URL in .env. Running a second postgres
# process against the same data volume caused WAL corruption on
# 2026-08-26 (both processes writing to platform_postgres_data
# concurrently) — do NOT reintroduce a local postgres service here.
# ===================================================================

services:
  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - platform_net

networks:
  platform_net:
    external: true
    name: platform_default
