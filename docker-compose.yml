# ===================================================================
# Standalone backend deployment.
#
# postgres+backend live on their own internal network (db_net); backend
# is additionally attached to the platform's existing network (platform_net,
# external — real name: platform_default) so bot/web/nginx in the platform
# monorepo keep resolving it as `backend:8000`, unchanged.
# ===================================================================

services:
  postgres:
    image: postgres:16
    container_name: backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema_fixed.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net

  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - db_net
      - platform_net

networks:
  db_net: {}
  platform_net:
    external: true
    name: platform_default

volumes:
  postgres_data:
    external: true
    name: platform_postgres_data
