# Конфигурация ruff для CI (`make lint`).
# Версия ruff зафиксирована в requirements.txt: без явного select набор правил
# по умолчанию зависит от версии ruff, и CI начинал бы падать при её обновлении.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Тесты подключают модули после подготовки фикстур/моков.
"tests/**" = ["E402"]
# Пакетные __init__.py реэкспортируют имена.
"__init__.py" = ["F401"]
