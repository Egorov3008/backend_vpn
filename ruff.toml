# Ruff config for CI (`make lint`). Without it the rule set depends on the ruff
# version, and newer versions enable style rules (UP, B, BLE, I, ...) the codebase
# doesn't follow yet. Keep the classic pyflakes + pycodestyle error set: it
# catches real bugs (undefined names, unused imports/variables) without churn.
target-version = "py311"
extend-exclude = [".venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Package __init__ files re-export names on purpose.
"__init__.py" = ["F401", "F403"]
